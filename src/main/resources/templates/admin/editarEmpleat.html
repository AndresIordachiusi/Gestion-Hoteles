<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Hoteles Iorda - Tus reservas</title>
   <link rel="stylesheet" th:href="@{/css/editarperfil.css}">
</head>
<body>

    <div class="navbar-container">


        <div class="logo">
            <a th:href="@{/}">Hoteles Iorda</a>
        </div>
        <div class="navbar">
            <a th:href="@{/}">Inicio</a>
            <a href="#home">Gestionar empleados</a>
            <a href="#about">Gestionar tareas</a>
            <a th:href="@{/admin/reserves}">Gestionar reservas</a>
            <a href="#contact">Gestionar clientes</a>
        </div>
        <form th:action="@{/logout}" method="POST">

            <button type="submit">Cerrar sesión</button>
           
           </form>
    </div>

        <h1>Editando datos del empleado:</h1>
        <h1><span th:text="${empleat.getNom + ' ' + empleat.getCognom}"> </span></h1>
        <br>
        

        <div class="container">


            <form th:action="@{/admin/empleat/actualitzar/{id}(id=${empleat.id})}" th:object="${empleat}" method="post">
                <input type="hidden" th:field="*{id}"/>
        
            <label>Nombre:</label>
            <input type="text" th:field="*{nom}"/>
    
            <label>Apellido:</label>
            <input type="text" th:field="*{cognom}"/>
        
            <label>Dirección:</label>
            <input type="text" th:field="*{adreça}"/>
    
            <label>Teléfono:</label>
            <input type="text" th:field="*{telefon}"/>
        
            <label>Email:</label>
            <input type="email" th:field="*{email}"/>
        
            <label>Sitio de trabajo:</label>
            <input type="text" th:field="*{llocFeina}"/>

       
        
            <button type="submit">Guardar cambios</button>
        </form>
        <form th:action="@{/admin/empleat/roladmin/{id}(id=${empleat.id})}" method="post">

           <button type="submit">Promover a Administrador</button> 
        </form>
</div>
    
</body>
</html>
