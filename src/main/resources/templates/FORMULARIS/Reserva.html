<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/reserva.css}">
    <title>Seleccionar Fechas</title>
</head>
<body>

    <h1>Selecciona tus fechas</h1>

    <form th:action="@{/hotels/{id}/reserva2(id=${hotel.id})}" method="post" th:object="${reserva}">
        <label>Fecha de inicio:</label>
        <input type="date" th:field="*{data_inici}" required>

        <label>Fecha final:</label>
        <input type="date" th:field="*{data_fi}" required>

        <button type="submit">Buscar habitaciones</button>
    </form>

</body>
</html>
