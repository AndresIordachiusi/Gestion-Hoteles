<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoteles Iorda - Editar Perfil</title>
    <link rel="stylesheet" th:href="@{/css/editarperfil.css}">
</head>
<body>
    <div class="navbar-container">
        <div class="logo">
            <a th:href="@{/}">Hoteles Iorda</a>
        </div>
        <div class="navbar">
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/hotels}">Reservar</a>
            <a href="#sobrenosotros">Sobre nosotros</a>
            <a href="#contact">Contacto</a>
        </div>
        <div class="account-buttons">
         <button class="account-button"><a th:href="@{/client/home}">Mi perfil</a></button>
     </div>
    </div>

    <div class="container">
        <h1>Editar Perfil</h1>
        <h2>Tu información actual:</h2>

        <form th:action="@{/client/editarperfil}" method="post">
            <label for="nom">Nombre:</label>
            <input type="text" id="nom" name="nom" th:value="${client.nom}" required>

            <label for="cognom">Apellido:</label>
            <input type="text" id="cognom" name="cognom" th:value="${client.cognom}" required>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" th:value="${client.email}" required>

            <label for="telefon">Teléfono:</label>
            <input type="text" id="telefon" name="telefon" th:value="${client.telefon}" required>

            <label for="password">Contraseña:</label>
            <input type="password" name="password" placeholder="Nueva contraseña"/>

            <button type="submit">Guardar cambios</button>
        </form>
    </div>
</body>
</html>
