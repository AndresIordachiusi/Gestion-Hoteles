<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/hotels.css}">
    <title>Hoteles Iorda - Hoteles</title>
</head>
<body>
    <div class="navbar-container">
        <div class="logo">
            <a th:href="@{/}">Hoteles Iorda</a>
        </div>
        <div class="navbar">
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/hotels}">Reservar</a>
            <a href="#sobrenosotros">Sobre nosotros</a>
            <a href="#contact">Contacto</a>
        </div>
        <button class="account-button"><a th:href="@{/login}">Iniciar sesión</a></button>
    </div>

    <div class="container">
        <h1>Nuestros hoteles</h1>
        
        <div class="hotels-grid">
            <div class="hotel-card" th:each="hotel : ${hotels}">
                <div class="hotel-header" th:text="${hotel.nom}"></div>
                <div class="hotel-image">
                    
        <img th:src="@{/images/{id}.jpg(id=${hotel.id})}" alt="Imagen del hotel"/>
        <img th:src="@{/images/{id}.jpg(id=${hotel.id})}" alt="Imagen del hotel"/>
        <img th:src="@{/images/{id}.jpg(id=${hotel.id})}" alt="Imagen del hotel"/>
                </div>
                <div class="hotel-body">
                    <div class="hotel-info">
                        <div class="info-item">
                            <span class="info-label">Dirección:</span>
                            <span th:text="${hotel.adreca}"></span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Ciudad:</span>
                            <span th:text="${hotel.ciutat}"></span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Categoría:</span>
                            <span th:text="${hotel.categoria.nom}"></span>
                        </div>
                    </div>
                    <div class="hotel-actions">
                        <a class="action-button" th:href="@{/hotels/{id}(id=${hotel.id})}">Ver habitaciones</a>
                        <a class="action-button" th:href="@{/hotels/{id}/reserves(id=${hotel.id})}">Reservar</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
