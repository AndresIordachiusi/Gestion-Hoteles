<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <title>Hoteles Iorda - Hoteles</title>
</head>
<body>
<div class="navbar-container">


            <div class="logo">
                <a th:href="@{/}">Hoteles Iorda</a>
            </div>
            <div class="navbar">
                <a th:href="@{/}">Inicio</a>
           <a th:href="@{/hotels}">Reservar</a>
           <a href="#sobrenosotros">Sobre nosotros</a>
           <a href="#contact">Contacto</a>
            </div>
            <button class="account-button"><a th:href="@{/login}">Log in</a></button>
        </div>

    <div class="container">
        <h1>Nuestros hoteles:</h1>
        

        
        <table class="hotel-list">

            <tr>
                <th>Nom</th>
                <th>Adreça</th>
                <th>Ciutat</th>
                <th>Categoria</th>
                <th>Habitacions</th>


            </tr>



        <tr th:each="hotel : ${hotels}">
            <td th:text="${hotel.nom}"></td>
            <td th:text="${hotel.adreca}"></td>
            <td th:text="${hotel.ciutat}"></td>
            <td th:text="${hotel.categoria.nom}"></td>
            <td>
                <a th:href="@{/hotels/{id}(id=${hotel.id})}">Ver habitaciones</a>
                <a th:href="@{/hotels/{id}/reserves(id=${hotel.id})}">Reservar</a>
                </td>

        </tr>     

        </table>
            
        
    </div>
</body>
</html>
