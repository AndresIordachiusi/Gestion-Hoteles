<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    


    <style>

.login {
    width: 50%;
    margin: auto;
    background: white;
    padding: 20px;
    box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
    border-radius: 10px;
}

.login h2 {
    text-align: center;
    color: #333;
}

.login form {
    display: flex;
    flex-direction: column;
}

.login label {
    font-weight: bold;
    margin-top: 10px;
    color: #333;
}

.login input,
.login select {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border: 1px solid #ddd;
    border-radius: 5px;
    font-size: 1em;
}

.login select[multiple] {
    height: 100px;
}

.login button {
    background-color: #007bff;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 5px;
    font-size: 1em;
    cursor: pointer;
    margin-top: 15px;
    transition: background-color 0.3s ease;
}

.login button:hover {
    background-color: #0056b3;
}

.login a {
    text-decoration: none;
}

.login a button {
    width: 100%;
}


    </style>
</head>
<body>
<h2>Login</h2>

    <div class="login">
    <form method="post" th:action="@{/login}" >
        <label>Usuari: <input type="text" name="username" /></label><br>
        <label>Contrasenya: <input type="password" name="password" /></label><br>
        <button type="submit">Entrar</button>
    </form>
    <p th:if="${param.error}">Usuari o contrasenya</p>
    <p th:if="${param.logout}">Has tancat sessió correctament</p>

    </div>
</body>
</html>
