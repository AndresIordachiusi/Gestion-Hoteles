<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">

</head>
<body>



<div class="navbar-container">


    <div class="logo">
        <a th:href="@{/}">Hoteles Iorda</a>
    </div>
    <div class="navbar">
        <a th:href="@{/}">Inicio</a>
        <a th:href="@{/hotels}">Reservar</a>
        <a href="#sobrenosotros">Sobre nosotros</a>
        <a href="#contact">Contacto</a>
    </div>
    <button class="account-button"><a th:href="@{/login}">Iniciar sesión</a></button>
</div>


<h2>Iniciar sesión o registrarse</h2>

    <div class="login">
    <form method="post" th:action="@{/login}" >
        <label>Usuario: <input type="text" name="username" /></label><br>
        <label>Contraseña: <input type="password" name="password" /></label><br>
        <p>¿No estás registrado?</p><br><a th:href="@{/altaClient}">Darse de alta</a>
        <button type="submit">Entrar</button>
    </form>
    <p th:if="${param.error}">¡Usuario o contraseña incorrectos!</p>
    <p th:if="${param.logout}">¡Has cerrado sesión correctamente!</p>

    </div>
</body>
</html>
