<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Llistat de Hotels</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

    <div class="navbar-container">


        <div class="logo">
            <a th:href="@{altaempleat}">Hoteles Iorda</a>
        </div>
        <div class="navbar">
            <a href="#home">Inicio</a>
            <a href="#about">Acerca</a>
            <a href="#services">Servicios</a>
            <a href="#contact">Contacto</a>
        </div>
        <button class="account-button"><a th:href="@{/login}">Log in</a></button>
    </div>
    
    <div class="container">
        
        <h1 th:text="${hotel.nom}"></h1>
        
        <table class="habitacions-list">

            <tr>
                <th>Numero</th>
                <th>Capacitat</th>
                <th>Descripcio</th>
                <th>Tipus</th>
                <th>Estat</th>
                <th>PreuNitAD</th>
                <th>PreuNitMP</th>
                <th>Hotel</th>
            </tr>
        


        <tr th:each="habita : ${habitacions}">

            <td th:text="${habita.numero}"></td>
            <td th:text="${habita.capacitat}"></td>
            <td th:text="${habita.descripcio}"></td>
            <td th:text="${habita.tipus}"></td>
            <td th:text="${habita.estat}"></td>
            <td th:text="${habita.preuNitAD}"></td>
            <td th:text="${habita.preuNitMP}"></td>
            <td th:text="${habita.hotel.nom}"></td>
        </tr>     

        </table>
            
        
    </div>
</body>
</html>
