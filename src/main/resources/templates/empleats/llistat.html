<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Empleats</title>
   <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
   <div class="navbar-container">


      <div class="logo">
          <a th:href="@{dashboard}">Hotel Iorda</a>
      </div>
      <div class="navbar">
       <a th:href="@{/}">Inicio</a>
       <a th:href="@{/altaempleat}">Dar de alta empleado</a>
       <a th:href="@{/empleats/llistat}">Lista de empleados</a>
      </div>
   
      <form th:action="@{/logout}" method="POST">

       <button type="submit">Cerrar sesión</button>
      
      </form>

  </div>
    <div class="container">
    <table class="empleats-list">       
           <tr>
                <th>Id</th>
               <th>Nom</th>
               <th>Cognom</th>
               <th>Lloc Feina</th>
               <th>Estat</th>
           </tr>
    

           <tr th:each="emp : ${empleats}">
            <td th:text="${emp.getId}"></td>
               <td th:text="${emp.getNom}"></td>
               <td th:text="${emp.getCognom}"></td>
               <td th:text="${emp.getLlocFeina}"></td>
               <td th:text="${emp.getEstat}"></td>
           </tr>
    


   </table>

</div>
  </div>
  
</body>
</html>
