<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Hoteles Iorda - Tus facturas</title>
   <link rel="stylesheet" th:href="@{/css/factura.css}">
</head>
<body>

    <div class="navbar-container">


        <div class="logo">
            <a th:href="@{/}">Hoteles Iorda</a>
        </div>
        <div class="navbar">
            <a th:href="@{/}">Inicio</a>
           <a th:href="@{/reserves/reserves}">Mis Reservas</a>
           <a th:href="@{/facturas/facturas}">Mis Facturas</a>
           <a th:href="@{/hotels}">Programar reserva</a>
           <a href="#sobrenosotros">Sobre nosotros</a>
           <a href="#contact">Contacto</a>
        </div>
        <form th:action="@{/logout}" method="POST">

            <button type="submit">Cerrar sesión</button>
           
           </form>
    </div>

    <div class="container">
        <h1>Tu lista de facturas</h1>
        <br>
        <div th:if="${#lists.isEmpty(factures)}">
            <h2>No hay ninguna factura disponible!</h2>
        </div>

    <table class="facturas-list"> 
        <thead>    
           <tr>
               <th>Hotel</th>
               <th>Fecha de la factura</th>
               <th>Metodo de pago</th>
               <th>Base imposable</th>
               <th>IVA</th>
               <th>Precio de factura</th>
               <th>Nombre y apellido</th>
           </tr>
    </thead>  

           <tr th:each="factura: ${factures}">
            <td th:text="${hotel}"></td>
            <td th:text="${factura.data_emisio}"></td>
            <td th:text="${factura.metode_pagament}"></td>
            <td th:text="${factura.base_imposable}"></td>
            <td th:text="${factura.iva}"></td>
            <td th:text="${factura.total}"></td>
            <td th:text="${nom + ' ' + cognom}"></td>
               <td>
               </td>
           </tr>
    


   </table>

</div>
    
</body>
</html>
