<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valora tu reserva - Hoteles Iorda</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <h1>Escribe tu valoración sobre tu reserva</h1>
    <form th:action="@{/valoracio/publicar}" method="post" th:object="${valoracio}">


        <label for="nota">Puntua tu reserva del 1 al 10!</label>
        <input type="number" th:field="*{nota}"  min="1" max="10" required><br>

        <label for="descripcio">Comentario:</label><br>
        <textarea th:field="*{comentari}" required></textarea><br>


        <button type="submit">Publicar valoración</button>
    </form>
</body>
</html>
